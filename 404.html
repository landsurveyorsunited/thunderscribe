<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not Found</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <main class="view" style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="empty route-not-found" data-status-code="404" role="status">
      <div class="empty-icon" aria-hidden="true">404</div>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or is no longer available.</p>
      <a class="btn btn-primary" href="./">Back to home</a>
    </div>
  </main>
</body>
</html>
