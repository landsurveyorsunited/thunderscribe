<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Thunderscribe</title>
  <meta name="description" content="A conversational transcript archive. Upload video transcripts, search them, and ask grounded questions with citations." />
  <meta name="theme-color" content="#0d0f14" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./styles/main.css" />
  <script type="importmap">
    {
      "imports": {
        "@websim/websim-socket": "https://esm.websim.com/@websim/websim-socket",
        "marked": "https://esm.sh/marked@12.0.2",
        "dompurify": "https://esm.sh/dompurify@3.1.6",
        "jszip": "https://esm.sh/jszip@3.10.1",
        "mammoth": "https://esm.sh/mammoth@1.8.0",
        "pdfjs-dist": "https://esm.sh/pdfjs-dist@4.4.168"
      }
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to main content</a>
  <div id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </span>
        <span class="brand-name">Thunderscribe</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="side-record" data-action="new-record">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M5 12a7 7 0 0 0 14 0M12 3v2M12 19v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Continuity supervisor</span>
        </button>
        <button class="side-trigger" data-action="new-import">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Import transcripts</span>
        </button>
      </div>
    </aside>

    <div class="shell-main">
      <header class="topbar" id="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="crumb" id="crumb"></div>
        <div class="mobile-topbar-brand" aria-label="Thunderscribe">Thunderscribe</div>
        <div class="topbar-right">
          <button class="search-trigger" id="global-search-trigger" type="button" aria-label="Search transcripts">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <span>Search transcripts</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn topbar-record" id="record-trigger" type="button" aria-label="Open continuity supervisor" title="Continuity supervisor">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M5 12a7 7 0 0 0 14 0M12 3v2M12 19v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">
            <svg class="ic-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="ic-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button class="icon-btn" id="help-tour" type="button" aria-label="Open product tour" title="Product tour">?</button>
          <button class="icon-btn profile-trigger" id="profile-trigger" type="button" aria-label="Open profile and settings" title="Profile and settings">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>
          </button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>

  <div id="composer-dock"></div>
  <div id="modal-root"></div>
  <div id="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="drawer-root"></div>
  <div id="route-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
